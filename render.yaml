services:
  # Backend API Service
  - type: web
    name: esg-api
    env: node
    buildCommand: pnpm install --ignore-scripts && pnpm --filter @workspace/api-server build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"

  # Frontend Dashboard (Static Site)
  - type: web
    name: esg-dashboard
    env: static
    buildCommand: pnpm install --ignore-scripts && pnpm --filter @workspace/esg-dashboard build
    staticPublishPath: artifacts/esg-dashboard/dist/public
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: "/"
    routes:
      # Proxy all API requests to the backend service
      - type: rewrite
        source: /api/*
        destination: https://esg-api.onrender.com/api/*
      # SPA fallback for React Router
      - type: rewrite
        source: /*
        destination: /index.html
